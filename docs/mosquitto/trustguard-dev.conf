# LOCAL DEVELOPMENT ONLY: password login, NO TLS. Usernames and passwords travel unencrypted, so use this only on a
# network you trust (home Wi-Fi, a phone hotspot you control). For anything else use trustguard.conf (TLS).
#
# Linux:   copy to /etc/mosquitto/conf.d/trustguard-dev.conf
# Windows: copy to C:\Program Files\mosquitto\ and start with   mosquitto -c trustguard-dev.conf -v
#          (allow inbound TCP 1883 for Mosquitto in Windows Defender Firewall, or the ESP32 cannot reach it)
#
# Create the users (you are asked for each password; do not reuse a real password):
#   mosquitto_passwd -c passwd trustguard_backend
#   mosquitto_passwd    passwd esp32
# and put the full path of the passwd / acl files below.
listener 1883
allow_anonymous false
password_file passwd
acl_file trustguard.acl
